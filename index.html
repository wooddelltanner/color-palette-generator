<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form id="get-color-scheme" class="container flex">
            <input type="color" id="selected-color"/>
            <select id="scheme-selector">
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome-dark</option>
                <option value="monochrome-light">Monochrome-light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic-complement</option>
                <option value="triad">Triad</option>
                <option value="quad">Quad</option>
            </select>
            <select id="number-select">
                <option value="2">2 colors</option>
                <option value="3">3 colors</option>
                <option value="4">4 colors</option>
                <option value="5">5 colors</option>
                <option value="6">6 colors</option>
                <option value="7">7 colors</option>
                <option value="8">8 colors</option>
                <option value="9">9 colors</option>
                <option value="10">10 colors</option>
            </select>
            <button type="submit" id="submit-color-scheme">Get color scheme</button>
        </form>
        
        <main class="flex" id="colors">
            <div>
                    <div style="background-color: #000000" class="color"></div>
                    <h1>#000000</h1>
            </div>
            <div>
                    <div style="background-color: #222222" class="color"></div>
                    <h1>#222222</h1>
            </div>
            <div>
                    <div style="background-color: #333333" class="color"></div>
                    <h1>#333333</h1>
            </div>
            <div>
                    <div style="background-color: #444444" class="color"></div>
                    <h1>#444444</h1>
            </div>
            <div>
                    <div style="background-color: #555555" class="color"></div>
                    <h1>#555555</h1>
            </div>
            <div>
                    <div style="background-color: #666666" class="color"></div>
                    <h1>#666666</h1>
            </div>
        </main>
                
        <script type="module" src="index.js"></script>
    </body>
</html>
